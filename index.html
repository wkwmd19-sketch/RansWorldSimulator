<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RansWorldSimulator</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;color:#dce8fa;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif}
.loading{text-align:center;padding:24px}.loading b{display:block;font-size:22px;margin-bottom:8px}.loading span{color:#92a3bf;font-size:13px}
</style>
</head>
<body>
<div class="loading"><b>RansWorldSimulator</b><span>v10.6 페이지를 불러오는 중...</span></div>
<script>
(async()=>{
  try{
    const r=await fetch('./app-base.html?v=10.6',{cache:'no-cache'});
    if(!r.ok)throw new Error(`app-base.html: ${r.status}`);
    let h=await r.text();

    const patch=(from,to,label)=>{
      if(!h.includes(from))throw new Error(`v10.6 패치 실패: ${label}`);
      h=h.replace(from,to);
    };

    // v10.5 · EXP inputs show thousands separators.
    patch('<input id="expA" type="number" min="0" max="100" step="0.01" value="0">','<input id="expA" type="text" inputmode="decimal" value="0">','expA');
    patch('<input id="expB" type="number" min="0" max="100" step="0.01" value="0">','<input id="expB" type="text" inputmode="decimal" value="0">','expB');
    patch('<input id="rbExp" type="number" min="0" max="100" step="0.01" value="0">','<input id="rbExp" type="text" inputmode="decimal" value="0">','rbExp');

    patch('function fmt(n){return Number(n||0).toLocaleString("ko-KR")}',`function fmt(n){return Number(n||0).toLocaleString("ko-KR")}
function parseNumInput(v){
  const n=Number(String(v??"").replace(/,/g,"").trim());
  return Number.isFinite(n)?n:NaN;
}
function groupDigitsString(s){
  const digits=String(s??"").replace(/\\D/g,"").replace(/^0+(?=\\d)/,"");
  return digits?digits.replace(/\\B(?=(\\d{3})+(?!\\d))/g,","):"";
}
function formatExpInput(el,mode,preserveCaret=false){
  if(!el)return;
  if(mode==="pct"){
    el.value=String(el.value??"").replace(/,/g,"");
    return;
  }
  const before=String(el.value??"");
  const oldPos=typeof el.selectionStart==="number"?el.selectionStart:before.length;
  const digitsBefore=before.slice(0,oldPos).replace(/\\D/g,"").length;
  const formatted=groupDigitsString(before);
  el.value=formatted;
  if(preserveCaret&&document.activeElement===el&&typeof el.setSelectionRange==="function"){
    let seen=0,pos=0;
    for(;pos<formatted.length;pos++){
      if(/\\d/.test(formatted[pos]))seen++;
      if(seen>=digitsBefore){pos++;break}
    }
    try{el.setSelectionRange(pos,pos)}catch(_){}
  }
}
function setExpInputValue(id,value,mode){
  const el=$(id);
  if(!el)return;
  if(value===null||value===undefined||value===""){el.value="";return}
  el.value=String(value);
  formatExpInput(el,mode,false);
}`,'helpers');

    patch('$("exp"+side).value=current;','setExpInputValue("exp"+side,current,"raw");','OCR EXP');
    patch('const la=Math.floor(Number($("levelA").value)),lb=Math.floor(Number($("levelB").value)),va=Number($("expA").value),vb=Number($("expB").value);','const la=Math.floor(Number($("levelA").value)),lb=Math.floor(Number($("levelB").value)),va=parseNumInput($("expA").value),vb=parseNumInput($("expB").value);','EXP calc');
    patch('$("rbExp").value=m.value;','setExpInputValue("rbExp",m.value,m.mode);','measurement apply');
    patch('const mode=$("rbExpMode").value,v=Number($("rbExp").value),rate=parseRate($("rbRate").value);','const mode=$("rbExpMode").value,v=parseNumInput($("rbExp").value),rate=parseRate($("rbRate").value);','rebirth calc');

    patch(`function updateExpMode(){
  const pct=$("expInputMode").value==="pct";
  $("expLabelA").textContent=pct?"시작 EXP (%)":"시작 EXP";
  $("expLabelB").textContent=pct?"종료 EXP (%)":"종료 EXP";
  ["expA","expB"].forEach(id=>{ $(id).max=pct?100:"";$(id).step=pct?.01:1});
}
$("expInputMode").onchange=updateExpMode;`,`function updateExpMode(){
  const pct=$("expInputMode").value==="pct";
  $("expLabelA").textContent=pct?"시작 EXP (%)":"시작 EXP";
  $("expLabelB").textContent=pct?"종료 EXP (%)":"종료 EXP";
  ["expA","expB"].forEach(id=>formatExpInput($(id),pct?"pct":"raw",false));
}
$("expInputMode").onchange=updateExpMode;
updateExpMode();
["expA","expB"].forEach(id=>{
  $(id).addEventListener("input",()=>formatExpInput($(id),$("expInputMode").value==="pct"?"pct":"raw",true));
  $(id).addEventListener("blur",()=>formatExpInput($(id),$("expInputMode").value==="pct"?"pct":"raw",false));
});`,'EXP mode');

    patch('function updateRbMode(){const pct=$("rbExpMode").value==="pct";$("rbExpLabel").textContent=pct?"현재 EXP (%)":"현재 EXP";$("rbExp").max=pct?100:"";$("rbExp").step=pct?.01:1}\n$("rbExpMode").onchange=updateRbMode;',`function updateRbMode(){
  const pct=$("rbExpMode").value==="pct";
  $("rbExpLabel").textContent=pct?"현재 EXP (%)":"현재 EXP";
  formatExpInput($("rbExp"),pct?"pct":"raw",false);
}
$("rbExpMode").onchange=updateRbMode;
updateRbMode();
$("rbExp").addEventListener("input",()=>formatExpInput($("rbExp"),$("rbExpMode").value==="pct"?"pct":"raw",true));
$("rbExp").addEventListener("blur",()=>formatExpInput($("rbExp"),$("rbExpMode").value==="pct"?"pct":"raw",false));`,'rebirth mode');

    // v10.6 · input labels/defaults/readability.
    patch('시작시각 · 24시간','시작시각 (24시간 형식)','start time label');
    patch('종료시각 · 24시간','종료시각 (24시간 형식)','end time label');
    patch('이번 환생 시작 시각 · 24시간','이번 환생 시작 시각 (24시간 형식)','rebirth start time label');
    patch('현재 시각 · 24시간','현재 시각 (24시간 형식)','rebirth current time label');

    patch('<input id="levelA" type="number" min="1" max="350" value="1">','<input id="levelA" type="number" min="1" max="350" placeholder="예: 286">','start level blank');
    patch('<input id="levelB" type="number" min="1" max="350" value="1">','<input id="levelB" type="number" min="1" max="350" placeholder="예: 287">','end level blank');

    patch('</style>','#rbRate::placeholder{font-size:12px;letter-spacing:-.02em}\n</style>','rebirth rate placeholder size');
    patch('const now=new Date();$("timeA").value=formatInputDate(now);$("timeB").value=formatInputDate(now);$("rbNow").value=formatInputDate(now);','const now=new Date();$("rbNow").value=formatInputDate(now);','EXP date defaults blank');

    patch('<div class="version">v10.4</div>','<div class="version">v10.6</div>','version');

    document.open();
    document.write(h);
    document.close();
  }catch(e){
    console.error(e);
    document.body.innerHTML=`<div class="loading"><b>페이지를 불러오지 못했습니다.</b><span>${String(e.message||e)}</span></div>`;
  }
})();
</script>
</body>
</html>
