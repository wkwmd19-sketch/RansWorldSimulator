<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="color-scheme" content="dark">
<title>RansWorldSimulator</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;color:#e1ebff;font-family:system-ui,"Noto Sans KR",sans-serif}
.rws-route{text-align:center;max-width:510px;padding:24px}
.rws-route h1{margin:0 0 10px;font-size:23px}
.rws-route p{color:#a5bad6;font-size:13px;line-height:1.7}
.rws-route a{color:#a6d6ff}
</style>
</head>
<body>
<main class="rws-route">
<h1>RansWorldSimulator</h1>
<p id="routeStatus" role="status">최신 배포 파일을 확인하는 중...</p>
<p><a href="./app-v10.34.html">v10.34로 직접 접속하기</a></p>
</main>
<script>
(function RWSStableRouter(){
  "use strict";
  // This URL is a stable entry point. Each actual app release has an immutable filename.
  const FALLBACK={version:"10.34",entry:"app-v10.34.html"};
  const $=id=>document.getElementById(id);
  const parse=v=>{const m=String(v||"").replace(/^v/i,"").match(/^(\d+)\.(\d+)(?:\.(\d+))?$/);return m?[+m[1],+m[2],+(m[3]||0)]:null};
  const compare=(a,b)=>{const x=parse(a),y=parse(b);if(!x||!y)return 0;for(let i=0;i<3;i++)if(x[i]!==y[i])return x[i]-y[i];return 0};
  const parseManifest=data=>{
    const version=String(data?.version||"").replace(/^v/i,"");
    const entry=String(data?.entry||"");
    if(!parse(version)||!/^app-v\d+\.\d+(?:\.\d+)?\.html$/.test(entry)||entry!=="app-v"+version+".html")return null;
    return{version,entry};
  };
  async function getManifest(path){
    const ac=new AbortController(),timeout=setTimeout(()=>ac.abort(),3500);
    try{
      const url=path+(path.includes("?")?"&":"?")+"fresh="+Date.now()+"-"+Math.random().toString(36).slice(2,7);
      const resp=await fetch(url,{cache:"no-store",signal:ac.signal});
      if(!resp.ok)return null;
      return parseManifest(await resp.json());
    }catch(e){return null}finally{clearTimeout(timeout)}
  }
  async function canServe(file){
    const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),3000);
    try{
      const u=new URL("./"+file,location.href);
      u.searchParams.set("probe",Date.now().toString());
      const r=await fetch(u.href,{method:"HEAD",cache:"no-store",signal:controller.signal});
      return r.ok;
    }catch(e){return false}finally{clearTimeout(timeout)}
  }
  async function route(){
    const manifests=await Promise.all([
      getManifest("./release.json"),
      getManifest("https://raw.githubusercontent.com/wkwmd19-sketch/RansWorldSimulator/main/release.json")
    ]);
    const newest=manifests.filter(Boolean).sort((a,b)=>compare(b.version,a.version))[0];
    let target=newest&&compare(newest.version,FALLBACK.version)>0?newest:FALLBACK;
    // Avoid routing to a release manifest before its versioned HTML reaches Pages.
    if(target.entry!==FALLBACK.entry&&!(await canServe(target.entry)))target=FALLBACK;
    $("routeStatus").textContent="v"+target.version+" 독립 페이지로 이동 중...";
    const url=new URL("./"+target.entry,location.href);
    // No reload loop: a versioned filename is never reused for a new release.
    location.replace(url.href);
  }
  route().catch(err=>{
    console.error("[RWS Router] Could not resolve release",err);
    $("routeStatus").textContent="버전 확인에 실패했습니다. 아래 링크에서 v10.34 사이트를 직접 열어주세요.";
  });
})();
</script>
</body>
</html>
