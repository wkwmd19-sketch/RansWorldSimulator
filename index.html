<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>RansWorldSimulator</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;color:#dce8fa;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif}
.loading{text-align:center;padding:24px;max-width:460px}
.loading b{display:block;font-size:22px;margin-bottom:8px}
.loading span{color:#92a3bf;font-size:13px}
</style>
</head>
<body>
<div class="loading"><b>RansWorldSimulator</b><span id="bootStatus">최신 버전 확인 중...</span></div>
<script>
(function RWSBootstrap1029(){
  const BOOT_VERSION="10.31";
  const RELEASE="./release.json";
  const stamp=Date.now().toString()+"-"+Math.random().toString(36).slice(2,8);
  const files=[
    "patch-v10.12.js",
    "egg-image-v10.12.js",
    "patch-v10.13.js",
    "patch-v10.22-loader.js",
    "patch-v10.23-exp.js",
    "patch-v10.24-rp.js",
    "patch-v10.26-titles.js",
    "patch-v10.27.js",
    "patch-v10.28-rp-table.js",
    "patch-v10.29-version-guard.js",
    "patch-v10.30-ui.js",
    "patch-v10.31-monster-levels.js"
  ];
  const label=document.getElementById("bootStatus");
  const parse=v=>{const match=String(v||"").replace(/^v/i,"").match(/^(\d+)\.(\d+)(?:\.(\d+))?$/);return match?[+match[1],+match[2],+(match[3]||0)]:null;};
  const newer=(a,b)=>{const x=parse(a),y=parse(b);if(!x||!y)return false;for(let i=0;i<3;i++){if(x[i]!==y[i])return x[i]>y[i];}return false;};
  const makeFreshUrl=latest=>{
    const url=new URL(window.location.href);
    url.searchParams.set("rws_retry",latest);
    url.searchParams.set("rws_cache",Date.now().toString()+"-"+Math.random().toString(36).slice(2,6));
    return url.href;
  };
  function showOldVersion(latest){
    document.body.innerHTML=
      `<div class="loading"><h2 style="margin:0 0 12px">최신 버전이 감지되었습니다.</h2>
      <p id="staleVersionMessage">기존 페이지가 캐시되어 표시되고 있습니다.</p>
      <button id="staleVersionReload" type="button" style="border:1px solid #6198d8;border-radius:10px;color:#fff;background:#215d9c;padding:12px 20px;font-weight:800;cursor:pointer">최신 버전으로 새로고침</button>
      <p style="font-size:12px;color:#a4b7d5;margin-top:14px">최신 배포가 서버에 반영되는 중이면 새로고침 후에도 기존 버전이 일시적으로 보일 수 있습니다.</p></div>`;
    document.getElementById("staleVersionMessage").textContent=
      "현재 불러온 페이지는 v"+BOOT_VERSION+"이지만 최신 배포는 v"+latest+"입니다.";
    document.getElementById("staleVersionReload").addEventListener("click",()=>window.location.replace(makeFreshUrl(latest)));
  }
  async function checkLatest(){
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),3500);
    try{
      const resp=await fetch(RELEASE+"?check="+stamp,{cache:"no-store",credentials:"same-origin",signal:controller.signal});
      if(!resp.ok)return null;
      const data=await resp.json();
      return parse(data?.version)?data.version:null;
    }catch(err){
      console.debug("[RWS] initial version check unavailable",err?.message||err);
      return null;
    }finally{clearTimeout(timer);}
  }
  async function boot(){
    const latest=await checkLatest();
    if(latest&&newer(latest,BOOT_VERSION)){
      const params=new URLSearchParams(location.search);
      if(params.get("rws_retry")!==latest){
        location.replace(makeFreshUrl(latest));
      }else{
        showOldVersion(latest);
      }
      return;
    }
    try{
      if(label)label.textContent="v"+BOOT_VERSION+" 페이지를 불러오는 중...";
      const response=await fetch("./loader-v10.10.html?v="+BOOT_VERSION+"&fresh="+stamp,{cache:"no-store",credentials:"same-origin"});
      if(!response.ok)throw Error("loader "+response.status);
      let content=await response.text();
      if(!content.includes("</body>"))throw Error("HTML 로더 구조를 확인할 수 없습니다.");
      const scripts=files.map(file=>'<scr'+'ipt src="./'+file+'?v='+BOOT_VERSION+'&fresh='+stamp+'"></scr'+'ipt>').join("");
      content=content.replace("</body>",scripts+"</body>");
      document.open();
      document.write(content);
      document.close();
    }catch(err){
      console.error("[RWS] loading failed",err);
      document.body.innerHTML=`<div class="loading"><h2>사이트를 불러오지 못했습니다.</h2><p id="siteLoadError"></p>
        <button id="retrySiteLoad" type="button" style="border:1px solid #6198d8;border-radius:10px;color:#fff;background:#215d9c;padding:12px 20px;cursor:pointer">캐시 없이 다시 불러오기</button></div>`;
      document.getElementById("siteLoadError").textContent=String(err.message||err);
      document.getElementById("retrySiteLoad").addEventListener("click",()=>location.replace(makeFreshUrl(BOOT_VERSION)));
    }
  }
  boot();
})();
</script>
</body></html>
