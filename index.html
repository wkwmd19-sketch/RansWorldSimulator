<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RansWorldSimulator</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;color:#dce8fa;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif}
.loading{text-align:center}
.loading b{display:block;font-size:22px;margin-bottom:8px}
.loading span{color:#92a3bf;font-size:13px}
</style>
</head>
<body>
<div class="loading"><b>RansWorldSimulator</b><span>페이지를 불러오는 중...</span></div>
<script>
(async()=>{
  try{
    const urls=Array.from({length:8},(_,i)=>`site/part${i}.txt`);
    const parts=await Promise.all(urls.map(async u=>{
      const r=await fetch(u,{cache:"no-cache"});
      if(!r.ok)throw new Error(`${u}: ${r.status}`);
      return r.text();
    }));
    document.open();
    document.write(parts.join(""));
    document.close();
  }catch(e){
    document.body.innerHTML=`<div class="loading"><b>페이지를 불러오지 못했습니다.</b><span>${String(e.message||e)}</span></div>`;
  }
})();
</script>
</body>
</html>
