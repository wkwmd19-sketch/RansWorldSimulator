    patch('function fmt(n){return Number(n||0).toLocaleString("ko-KR")}',`function fmt(n){return Number(n||0).toLocaleString("ko-KR")}
function parseNumInput(v){
  const n=Number(String(v??"").replace(/,/g,"").trim());
  return Number.isFinite(n)?n:NaN;
}
function groupDigitsString(s){
  const digits=String(s??"").replace(/\\D/g,"").replace(/^0+(?=\\d)/,"");
  return digits?digits.replace(/\\B(?=(\\d{3})+(?!\\d))/g,","):"";
}
function formatExpInput(el,mode,preserveCaret=false){
  if(!el)return;
  if(mode==="pct"){
    el.value=String(el.value??"").replace(/,/g,"");
    return;
  }
  const before=String(el.value??"");
  const oldPos=typeof el.selectionStart==="number"?el.selectionStart:before.length;
  const digitsBefore=before.slice(0,oldPos).replace(/\\D/g,"").length;
  const formatted=groupDigitsString(before);
  el.value=formatted;
  if(preserveCaret&&document.activeElement===el&&typeof el.setSelectionRange==="function"){
    let seen=0,pos=0;
    for(;pos<formatted.length;pos++){
      if(/\\d/.test(formatted[pos]))seen++;
      if(seen>=digitsBefore){pos++;break}
    }
    try{el.setSelectionRange(pos,pos)}catch(_){}
  }
}
function setExpInputValue(id,value,mode){
  const el=$(id);
  if(!el)return;
  if(value===null||value===undefined||value===""){el.value="";return}
  el.value=String(value);
  formatExpInput(el,mode,false);
}`,'helpers');

    patch('const pricing=DATA.pricing;',`const pricing=DATA.pricing;
(()=>{
  const oldSp=[...DATA.pricing.sp.prices];
  const sp=[...oldSp];
  sp[0]=20;
  for(let n=1;n<10;n++)sp[n]=20*n;
  sp[10]=220;
  for(let n=11;n<=20;n++)sp[n]=220+72*(n-10);
  for(let n=21;n<=30;n++)sp[n]=940+226*(n-20);
  for(let n=31;n<=40;n++)sp[n]=3200+600*(n-30);
  for(let n=41;n<=50;n++)sp[n]=9200+1080*(n-40);
  for(let n=51;n<=60;n++)sp[n]=20000+2040*(n-50);
  for(let n=61;n<=70;n++)sp[n]=40400+3100*(n-60);
  for(let n=71;n<=80;n++)sp[n]=71400+4124*(n-70);
  for(let n=81;n<=90;n++)sp[n]=112640+5136*(n-80);
  const shift=oldSp[90]-sp[90];
  for(let n=91;n<sp.length;n++)sp[n]=Math.max(0,oldSp[n]-shift);
  DATA.pricing.sp.prices=sp;
  DATA.pricing.sp.exact=21;
  DATA.pricing.sp.method="Lv.0~20은 사용자 확인값/공차를 반영. Lv.21~90은 10레벨마다 공차가 바뀐다는 가설을 +33=5,000 / +50=20,000 / +66=59,000 / +90=164,000 실측값에 맞춰 보정한 추정. Lv.91 이후는 기존 비용표 흐름을 +90 실측값에 맞춰 보정한 추정";
  DATA.pricing.move.prices=Array.from({length:100},(_,n)=>50+25*n);
  DATA.pricing.move.exact=100;
  DATA.pricing.move.method="사용자 실측 기준: 최초 50 RP, 이후 공차 +25 RP (+2.0%에서 150 RP, +28.0%에서 1,450 RP 확인)";
})();`,'RP pricing v10.7');

function loadShop(){
  const raw=localStorage.getItem(STORAGE_KEY);if(!raw){alert("저장된 선택이 없습니다.");return}
  try{const d=JSON.parse(raw);$("owned").value=d.owned??0;(d.state||[]).forEach((s,i)=>{if(products[i]){products[i].ticks=clamp(Number(s.ticks)||0,0,products[i].maxTicks);products[i].locked=!!s.locked}});renderShop()}catch(e){alert("저장 데이터를 불러오지 못했습니다.")}
}`,`let shopViewMode=localStorage.getItem("RansWorldSimulator-shop-view")==="compact"?"compact":"detail";
function applyShopView(){
  const shop=$("shop");
  shop.classList.toggle("compact",shopViewMode==="compact");
  const btn=$("viewModeBtn");
  if(btn)btn.textContent=shopViewMode==="compact"?"자세히 보기":"간단히 보기";
}
function toggleShopView(){
  shopViewMode=shopViewMode==="compact"?"detail":"compact";
  localStorage.setItem("RansWorldSimulator-shop-view",shopViewMode);
  applyShopView();
}
function buildShopSave(){
  return{format:"RansWorldSimulator",saveVersion:1,appVersion:"v10.9",savedAt:new Date().toISOString(),owned:String($("owned").value??0),viewMode:shopViewMode,products:products.map(p=>({id:p.id,ticks:p.ticks,locked:!!p.locked}))};
}
function applyShopSave(d){
  if(!d||typeof d!=="object")throw new Error("저장 데이터 형식이 올바르지 않습니다.");
  $("owned").value=d.owned??0;
  const state=Array.isArray(d.products)?d.products:Array.isArray(d.state)?d.state:[];
  if(state.length){const byId=new Map(state.filter(x=>x&&x.id).map(x=>[x.id,x]));products.forEach((p,i)=>{const s=byId.get(p.id)||(!byId.size?state[i]:null);if(!s)return;p.ticks=clamp(Number(s.ticks)||0,0,p.maxTicks);p.locked=!!s.locked})}
  if(d.viewMode==="compact"||d.viewMode==="detail"){shopViewMode=d.viewMode;localStorage.setItem("RansWorldSimulator-shop-view",shopViewMode)}
  renderShop();applyShopView();
}
function saveShop(){localStorage.setItem(STORAGE_KEY,JSON.stringify(buildShopSave()));alert("현재 RP 상점 설정을 이 브라우저에 저장했습니다.")}
function loadShop(){const raw=localStorage.getItem(STORAGE_KEY);if(!raw){alert("이 브라우저에 저장된 RP 상점 설정이 없습니다.");return}try{applyShopSave(JSON.parse(raw))}catch(e){console.error(e);alert("브라우저 저장 데이터를 불러오지 못했습니다.")}}
function exportShopJson(){const data=JSON.stringify(buildShopSave(),null,2),blob=new Blob([data],{type:"application/json;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a"),stamp=new Date(),pad2=n=>String(n).padStart(2,"0");a.href=url;a.download="RansWorldSimulator_RP_"+stamp.getFullYear()+pad2(stamp.getMonth()+1)+pad2(stamp.getDate())+"_"+pad2(stamp.getHours())+pad2(stamp.getMinutes())+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importShopJsonFile(file){if(!file)return;try{const text=await file.text(),d=JSON.parse(text);if(d.format&&d.format!=="RansWorldSimulator")throw new Error("RansWorldSimulator 저장 파일이 아닙니다.");applyShopSave(d);alert("JSON 저장 파일을 불러왔습니다.")}catch(e){console.error(e);alert(e?.message||"JSON 저장 파일을 불러오지 못했습니다.")}finally{$("importFile").value=""}}`,'shop save/load v10.9');
